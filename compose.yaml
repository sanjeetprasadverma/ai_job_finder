

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11111:11434"
    volumes:
      - .ollama:/root/.ollama
    networks:
          - job-network
    
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - .ollama_data:/root/.ollama
    restart: "no"
    # entrypoint: >
    #   sh -c "
    #     until ollama list >/dev/null 2>&1; do
    #       sleep 2
    #     done
    #     ollama pull nomic-embed-text
    #   "
    entrypoint: >
      sh -c "ollama pull nomic-embed-text"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
          - job-network
  ollama-init1:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - .ollama_data:/root/.ollama
    restart: "no"
    # entrypoint: >
    #   sh -c "
    #     until ollama list >/dev/null 2>&1; do
    #       sleep 2
    #     done
    #     ollama pull nomic-embed-text
    #   "
    entrypoint: >
      sh -c "ollama pull qwen3"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
          - job-network
  postgres:
      image: postgres
      container_name: postgresjob
      volumes:
            - ./postgresnew:/var/lib/postgresql/data
      environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=ragdb
      ports:
            - "5411:5432"
      # restart: always
      networks:
          - job-network
  pgvector:
      image: ankane/pgvector
      container_name: pgvectorjob
      volumes:
          - ./pgvector:/var/lib/postgresql/data
      environment:
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=postgres
          - POSTGRES_DB=postgres
      ports:
          - "5412:5432"
      # restart: always
      networks:
          - job-network
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: job-airflow
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/airflow/src
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin   # user:role
      # AIRFLOW__SIMPLE_AUTH_MANAGER__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin   
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: airflow api-server
    volumes:
      - ./Airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./Airflow/plugins:/opt/airflow/plugins
      - ./common:/opt/airflow/dags/common
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - job-network
  mcp:
    build:
      context: ./MCP
      dockerfile: Dockerfile
    container_name: job-mcp
    env_file:
      - .env
    volumes:
      - ./MCP:/app
      - ./logs:/app/logs
      - ./common:/app/common
    ports:
      - "9000:8000"
    depends_on:
      - ollama
      - postgres
      - pgvector
    networks:
      - job-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./common:/app/common
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - mcp
    networks:
      - job-network
  
  

networks:
  job-network:
    driver: bridge